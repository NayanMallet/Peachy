  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

set:7px;border-radius:50%;background:radial-gradient(circle at 34% 28%, #4e4f57 0%, #34353b 45%, #212226 100%);box-shadow:inset 0 2px 4px rgba(255,255,255,.14), inset 0 -4px 8px rgba(0,0,0,.55)\">\n                    <div style=\"position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.045) 0deg 1.6deg, rgba(0,0,0,.05) 1.6deg 3.2deg);opacity:.6\"><\u002Fdiv>\n                    <div style=\"position:absolute;inset:24px;border-radius:50%;background:radial-gradient(circle at 38% 30%, #3a3b41, #1b1c20 75%);box-shadow:inset 0 1px 2px rgba(255,255,255,.12), 0 2px 5px rgba(0,0,0,.5)\"><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"{{ k.rotStyle }}\"><div style=\"{{ k.pinStyle }}\"><\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:13px;letter-spacing:3px;color:#c9cbd1;font-weight:600;text-shadow:0 1px 0 rgba(0,0,0,.7)\">{{ k.name }}<\u002Fdiv>\n              <div style=\"font-family:'Share Tech Mono',monospace;font-size:13px;color:#ffb98a;text-shadow:0 0 5px rgba(255,158,109,.5);background:#141508;border:1px solid #0a0b08;border-radius:4px;padding:2px 10px;box-shadow:inset 0 2px 4px rgba(0,0,0,.8)\">{{ k.display }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ── FOOTER ── -->\n    <div style=\"display:flex;align-items:center;justify-content:space-between;padding:8px 28px;background:linear-gradient(180deg,#1b1c20,#17181b);border-top:1px solid rgba(255,255,255,.05);box-shadow:inset 0 1px 0 rgba(0,0,0,.5)\">\n      <div style=\"font-size:9px;letter-spacing:2.5px;color:#5c5e65\">PEACHY AUDIO · VST3 / AU<\u002Fdiv>\n      <div style=\"font-size:9px;letter-spacing:2.5px;color:#5c5e65\">24-BIT · 96 kHz<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1060,&quot;height&quot;:640},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#FF9E6D&quot;,&quot;options&quot;:[&quot;#FF9E6D&quot;,&quot;#FF7E5F&quot;,&quot;#FFC29E&quot;,&quot;#7FD1C4&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Look&quot;},&quot;ledGlow&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0,&quot;max&quot;:2,&quot;step&quot;:0.1,&quot;unit&quot;:&quot;×&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Look&quot;},&quot;tickLabels&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Look&quot;}}\">\nclass Component extends DCLogic {\n  state = { pitch: 0, formant: 0, drive: 3.5, mix: 100, mode: 'TRANSPOSE', linked: false };\n\n  accent() { return this.props.accent ?? '#FF9E6D'; }\n  glow() { return this.props.ledGlow ?? 1; }\n\n  startDrag(key, min, max) {\n    return (e) => {\n      e.preventDefault();\n      const startY = e.clientY, start = this.state[key];\n      const move = (ev) => {\n        let v = Math.min(max, Math.max(min, start + (startY - ev.clientY) * (max - min) / 220));\n        const patch = { [key]: v };\n        if (this.state.linked) {\n          if (key === 'pitch') patch.formant = v;\n          if (key === 'formant') patch.pitch = v;\n        }\n        this.setState(patch);\n      };\n      const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };\n      window.addEventListener('pointermove', move);\n      window.addEventListener('pointerup', up);\n    };\n  }\n\n  angleFor(v, min, max) { return -135 + 270 * (v - min) / (max - min); }\n\n  makeKnob(key, name, min, max, def, tickCount, labelVals, fmt, order, withLeds) {\n    const v = this.state[key];\n    const a = this.angleFor(v, min, max);\n    const acc = this.accent(), g = this.glow();\n    const showLabels = this.props.tickLabels ?? true;\n\n    const frac = (v - min) / (max - min);\n    const ticks = [];\n    for (let i = 0; i < tickCount; i++) {\n      const ta = -135 + 270 * i / (tickCount - 1);\n      const lit = ta <= a + 0.01;\n      const glowPx = withLeds ? (3 + 10 * frac) * g : 5 * g;\n      ticks.push({ style: {\n        position: 'absolute', left: '50%', top: '50%', width: '2px', height: '8px',\n        margin: '-4px 0 0 -1px', borderRadius: '1px',\n        background: lit ? acc : '#4a4b51',\n        boxShadow: lit ? ('0 0 ' + glowPx.toFixed(1) + 'px ' + acc) : 'none',\n        opacity: (lit && withLeds) ? (0.55 + 0.45 * frac) : 1,\n        transform: 'rotate(' + ta + 'deg) translateY(-64px)'\n      }});\n    }\n\n    const labels = showLabels ? labelVals.map(([val, text]) => {\n      const la = this.angleFor(val, min, max), rad = (la - 90) * Math.PI / 180;\n      return { text, style: {\n        position: 'absolute',\n        left: 'calc(50% + ' + (Math.cos(rad) * 88).toFixed(1) + 'px)',\n        top: 'calc(50% + ' + (Math.sin(rad) * 88).toFixed(1) + 'px)',\n        transform: 'translate(-50%,-50%)', fontSize: '10px', color: '#84868d',\n        fontFamily: \"'Share Tech Mono',monospace\", textShadow: '0 1px 0 rgba(0,0,0,.6)'\n      }};\n    }) : [];\n\n    const leds = [];\n\n    return {\n      name, order, ticks, labels, leds,\n      display: fmt(v),\n      onDown: this.startDrag(key, min, max),\n      onReset: () => this.setState({ [key]: def }),\n      rotStyle: { position: 'absolute', inset: '7px', transform: 'rotate(' + a + 'deg)', pointerEvents: 'none' },\n      pinStyle: {\n        position: 'absolute', left: '50%', top: '7px', width: '5px', height: '22px',\n        marginLeft: '-2.5px', borderRadius: '3px', background: acc,\n        boxShadow: '0 0 ' + (8 * g) + 'px ' + acc + ', inset 0 1px 1px rgba(255,255,255,.5)'\n      }\n    };\n  }\n\n  renderVals() {\n    const acc = this.accent(), g = this.glow();\n    const st = (v) => (v >= 0 ? '+' : '') + v.toFixed(1) + ' st';\n\n    const modes = ['TRANSPOSE', 'QUANTIZE', 'ROBOT'].map((name) => {\n      const active = this.state.mode === name;\n      return {\n        name,\n        onClick: () => this.setState({ mode: name }),\n        btnStyle: {\n          display: 'flex', alignItems: 'center', gap: '10px', padding: '11px 14px',\n          borderRadius: '7px', cursor: 'pointer',\n          background: active\n            ? 'linear-gradient(180deg,#232428 0%,#2a2b30 100%)'\n            : 'linear-gradient(180deg,#3b3c42 0%,#26272c 100%)',\n          boxShadow: active\n            ? 'inset 0 3px 6px rgba(0,0,0,.6), inset 0 -1px 0 rgba(255,255,255,.06), 0 1px 0 rgba(255,255,255,.05)'\n            : '0 4px 8px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.14), inset 0 -2px 3px rgba(0,0,0,.4)',\n          transform: active ? 'translateY(1px)' : 'none',\n          border: '1px solid ' + (active ? '#0e0f11' : '#17181b')\n        },\n        ledStyle: {\n          width: '9px', height: '9px', borderRadius: '50%', flexShrink: 0,\n          background: active ? acc : '#2a2b2f',\n          boxShadow: active\n            ? ('0 0 ' + (10 * g) + 'px ' + acc + ', inset 0 0 2px rgba(255,255,255,.7)')\n            : 'inset 0 1px 2px rgba(0,0,0,.8), 0 1px 0 rgba(255,255,255,.06)'\n        },\n        labelStyle: {\n          fontSize: '12px', letterSpacing: '2.5px', fontWeight: 600,\n          color: active ? '#ffd6b8' : '#9a9ca3',\n          textShadow: active ? ('0 0 ' + (6 * g) + 'px rgba(255,158,109,.55)') : '0 1px 0 rgba(0,0,0,.7)'\n        }\n      };\n    });\n\n    const linked = this.state.linked;\n\n    return {\n      lcdMode: this.state.mode,\n      pfKnobs: [\n        Object.assign(this.makeKnob('pitch', 'PITCH', -12, 12, 0, 25, [[-12,'-12'],[-6,'-6'],[0,'0'],[6,'+6'],[12,'+12']], st, 0, false), {}),\n        Object.assign(this.makeKnob('formant', 'FORMANT', -12, 12, 0, 25, [[-12,'-12'],[-6,'-6'],[0,'0'],[6,'+6'],[12,'+12']], st, 2, false), {})\n      ],\n      outKnobs: [\n        this.makeKnob('drive', 'DRIVE', 0, 10, 0, 21, [[0,'0'],[5,'5'],[10,'10']], (v) => v.toFixed(1), 0, true),\n        this.makeKnob('mix', 'MIX', 0, 100, 100, 21, [[0,'0'],[50,'50'],[100,'100']], (v) => Math.round(v) + ' %', 0, false)\n      ],\n      modes,\n      toggleLink: () => this.setState({ linked: !linked, formant: !linked ? this.state.pitch : this.state.formant }),\n      linkLedStyle: {\n        width: '10px', height: '10px', borderRadius: '50%',\n        background: linked ? acc : '#2a2b2f',\n        boxShadow: linked\n          ? ('0 0 ' + (12 * g) + 'px ' + acc + ', inset 0 0 2px rgba(255,255,255,.7)')\n          : 'inset 0 1px 2px rgba(0,0,0,.8), 0 1px 0 rgba(255,255,255,.06)'\n      },\n      linkBtnStyle: {\n        padding: '10px 8px', borderRadius: '7px', cursor: 'pointer',\n        fontSize: '10px', letterSpacing: '2px', fontWeight: 600,\n        color: linked ? '#ffd6b8' : '#9a9ca3',\n        textShadow: linked ? ('0 0 ' + (6 * g) + 'px rgba(255,158,109,.55)') : '0 1px 0 rgba(0,0,0,.7)',\n        background: linked\n          ? 'linear-gradient(180deg,#232428 0%,#2a2b30 100%)'\n          : 'linear-gradient(180deg,#3b3c42 0%,#26272c 100%)',\n        boxShadow: linked\n          ? 'inset 0 3px 6px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.05)'\n          : '0 4px 8px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.14), inset 0 -2px 3px rgba(0,0,0,.4)',\n        transform: linked ? 'translateY(1px)' : 'none',\n        border: '1px solid ' + (linked ? '#0e0f11' : '#17181b')\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
